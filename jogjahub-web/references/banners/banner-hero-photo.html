<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JogjaHub Hero Banner — Variant 03 Photo / Illustrated</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary-container: #FF6B00;
    --navy: #1E293B;
    --navy-deep: #0F172A;
    --navy-accent: #FBBF24;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Lexend', 'Inter', sans-serif; background: #0F172A; }
  .banner {
    position: relative;
    width: 1500px;
    height: 500px;
    overflow: hidden;
    background: linear-gradient(100deg, #0F172A 0%, #1E293B 58%, #334155 100%);
    color: var(--white);
    display: flex; align-items: center;
  }
  /* left: text */
  .content {
    position: relative; z-index: 3;
    max-width: 46%;
    padding: 0 72px;
    display: flex; flex-direction: column; gap: 20px;
  }
  .badge {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    border-radius: 999px;
    padding: 6px 14px;
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--navy-accent); }
  .headline { font-size: 50px; line-height: 1.06; font-weight: 700; letter-spacing: -1px; }
  .headline em { font-style: normal; color: var(--primary-container); }
  .subhead { font-family: 'Inter', sans-serif; font-size: 17px; line-height: 1.65; color: rgba(255,255,255,.86); }
  .btn-cta {
    align-self: flex-start;
    display: inline-flex; align-items: center; justify-content: center;
    height: 52px; padding: 0 30px; border-radius: 14px;
    background: var(--primary-container); color: var(--white);
    font-family: 'Lexend', sans-serif; font-size: 16px; font-weight: 600;
    text-decoration: none; box-shadow: 0 14px 30px rgba(255,107,0,.32);
    transition: transform .2s ease;
  }
  .btn-cta:hover { transform: translateY(-2px); }
  .scene {
    position: absolute; right: 40px; top: 50%; transform: translateY(-50%);
    width: 620px; height: 460px; z-index: 2;
    filter: drop-shadow(0 24px 60px rgba(0,0,0,.45));
  }
  .scene .card {
    position: absolute; background: rgba(255,255,255,.06);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 22px; padding: 18px;
    backdrop-filter: blur(4px);
  }
  .card-photo { width: 300px; height: 360px; right: 20px; top: 12px; }
  .card-photo .person {
    width: 100%; height: 100%;
    border-radius: 14px;
    background: linear-gradient(150deg, #FF6B00 0%, #A04100 55%, #1E293B 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .card-chip { width: 210px; height: 96px; left: 0; top: 150px; display: flex; align-items: center; gap: 14px; }
  .card-chip .img { width: 58px; height: 58px; border-radius: 14px; background: linear-gradient(135deg, #FBBF24, #FF6B00); display: flex; align-items: center; justify-content: center; }
  .card-chip .t { line-height: 1.35; }
  .card-chip .t b { font-family: 'Lexend', sans-serif; font-weight: 600; font-size: 15px; display: block; }
  .card-chip .t span { font-family: 'Inter', sans-serif; font-size: 12px; color: rgba(255,255,255,.75); }
  .card-booking { width: 250px; height: 118px; left: 40px; bottom: 0; }
  .card-booking .row { display: flex; justify-content: space-between; font-family: 'Inter', sans-serif; font-size: 13px; color: rgba(255,255,255,.8); }
  .card-booking .bar { height: 8px; border-radius: 999px; background: rgba(255,255,255,.15); margin-top: 8px; overflow: hidden; }
  .card-booking .bar i { display: block; height: 100%; width: 72%; border-radius: 999px; background: var(--primary-container); }
</style>
</head>
<body>
<div class="banner" role="img" aria-label="JogjaHub: Booking kebutuhan wisuda dari mana saja">
    <!-- illustrated scene -->
    <div class="scene" aria-hidden="true">
      <div class="card card-photo">
        <div class="person">
          <svg width="130" height="130" viewBox="0 0 24 24" fill="none">
            <path d="M12 3L1 8l11 5 9-4.09V16h2V8L12 3z" fill="#FFFFFF" opacity="0.95"/>
            <path d="M5 11.5v4.6c0 1.05 3.13 2.4 7 2.4s7-1.35 7-2.4v-4.6L12 15l-7-3.5z" fill="#FBBF24"/>
            <path d="M19 16v4.5l2-1v-4l-2 .5z" fill="#FFFFFF" opacity="0.85"/>
          </svg>
        </div>
      </div>
      <div class="card card-chip">
        <div class="img">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1E293B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="18" r="1.6" fill="#FFFFFF" stroke="none"/><circle cx="12" cy="15.5" r="1.6" fill="#FFFFFF" stroke="none"/><circle cx="15" cy="18" r="1.6" fill="#FFFFFF" stroke="none"/>
            <path d="M6 6c1.2-1 3-1 4 .4"/><path d="M13.5 4.5c1.8-.2 3 1 3.4 2.6"/><path d="M15 10c2 .3 2.8 2.4 1.6 3.8"/>
            <path d="M12 4.5V15"/><path d="M8 8c-2-.4-2.6 2.2-.8 3"/><path d="M9 11.5c-1.8.6-2 3-.4 3.8"/>
            <path d="M12 15c2.4-1 4.4 1 3.2 3.2L12 20l-3.2-1.8C7.6 15.9 9.6 14 12 15z" fill="rgba(251,191,36,.35)"/>
          </svg>
        </div>
        <div class="t"><b>Buket &amp; Gifting</b><span>Florist DIY</span></div>
      </div>
      <div class="card card-booking">
        <div class="row"><span>Slot dini hari</span><span>08.00</span></div>
        <div class="row" style="margin-top:6px"><span>Ketersediaan</span><span style="color:#FBBF24">94%</span></div>
        <div class="bar"><i></i></div>
      </div>
    </div>

    <!-- left text -->
    <div class="content">
      <span class="badge"><span class="dot"></span> Booking online · Tanpa antre</span>
      <h1 class="headline">Persiapkan Wisuda dari <em>Mana Saja</em></h1>
      <p class="subhead">MUA, salon, butik, hotel, hingga buket — pilih slot dini hari dan pastikan semuanya siap sebelum hari-H.</p>
      <a class="btn-cta" href="#login">Mulai Sekarang</a>
    </div>
  </div>
</body>
</html>
