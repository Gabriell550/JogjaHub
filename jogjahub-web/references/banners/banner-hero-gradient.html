<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JogjaHub Hero Banner — Variant 01 Gradient</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary-container: #FF6B00;
    --primary: #A04100;
    --navy: #1E293B;
    --navy-deep: #0F172A;
    --navy-accent: #FBBF24;
    --white: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Lexend', 'Inter', sans-serif; background: #0F172A; }
  .banner {
    position: relative;
    width: 1500px;
    height: 500px;
    overflow: hidden;
    display: flex;
    align-items: center;
    background: radial-gradient(1200px 600px at 0% 0%, #FF6B00 0%, #A04100 42%, #1E293B 72%, #0F172A 100%);
    color: var(--white);
  }
  /* decorative blurred orbs */
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; }
  .orb-1 { width: 420px; height: 420px; right: 60px; top: -120px; background: #FF6B00; }
  .orb-2 { width: 260px; height: 260px; left: 55%; bottom: -90px; background: #1E293B; }
  /* subtle grid */
  .grid-overlay {
    position: absolute; inset: 0; opacity: .10;
    background-image: linear-gradient(rgba(255,255,255,.35) 1px, transparent 1px),
                      linear-gradient(90deg, rgba(255,255,255,.35) 1px, transparent 1px);
    background-size: 54px 54px;
  }
  .content {
    position: relative; z-index: 2;
    max-width: 70%; /* safe zone */
    padding: 48px 72px;
    display: flex; flex-direction: column; gap: 22px;
  }
  .badge {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,.14);
    border: 1px solid rgba(255,255,255,.28);
    border-radius: 999px;
    padding: 7px 16px;
    font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500;
    letter-spacing: .4px;
  }
  .badge .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--navy-accent); }
  .headline {
    font-size: 64px;
    line-height: 1.04;
    font-weight: 700;
    letter-spacing: -1.5px;
    color: var(--white);
    max-width: 900px;
  }
  .headline em { font-style: normal; color: var(--navy-accent); }
  .subhead {
    font-family: 'Inter', sans-serif;
    font-size: 19px; font-weight: 400; line-height: 1.6;
    color: rgba(255,255,255,.86);
    max-width: 620px;
  }
  .cta-row { display: flex; align-items: center; gap: 18px; margin-top: 6px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    height: 54px; padding: 0 34px; border-radius: 14px;
    font-family: 'Lexend', sans-serif; font-size: 17px; font-weight: 600;
    text-decoration: none; transition: transform .2s ease, box-shadow .2s ease;
  }
  .btn-cta { background: var(--white); color: var(--navy-deep); box-shadow: 0 14px 30px rgba(0,0,0,.28); }
  .btn-cta:hover { transform: translateY(-2px); box-shadow: 0 18px 36px rgba(0,0,0,.34); }
  .btn-outline { border: 1.5px solid rgba(255,255,255,.55); color: var(--white); margin-top: 0; }
  .btn-outline:hover { background: rgba(255,255,255,.10); transform: translateY(-2px); }
  .meta { font-family: 'Inter', sans-serif; font-size: 14px; color: rgba(255,255,255,.72); margin-top: 4px; }
</style>
</head>
<body>
  <div class="banner" role="img" aria-label="JogjaHub: Semua Kebutuhan Wisudamu, Satu Platform">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="grid-overlay"></div>

    <div class="content">
      <span class="badge"><span class="dot"></span> Platform Wisuda #1 di Yogyakarta</span>
      <h1 class="headline">Semua Kebutuhan Wisudamu, <em>Satu Platform</em></h1>
      <p class="subhead">Salon, butik, penginapan, dan gifting — booking online tanpa antre dini hari.</p>
      <div class="cta-row">
        <a class="btn btn-cta" href="#login">Mulai Sekarang</a>
        <a class="btn btn-outline" href="#tenant">Daftar sebagai Tenant</a>
      </div>
      <p class="meta">Gratis untuk customer · Verifikasi tenant 1×24 jam</p>
    </div>
  </div>
</body>
</html>
